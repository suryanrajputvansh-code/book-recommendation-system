services:
  - type: web
    name: book-recommendation-system
    env: python
    buildCommand: "pip install -r requirements.txt && python ml/prepare_model.py && cd frontend && npm install && npm run build"
    startCommand: "python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
